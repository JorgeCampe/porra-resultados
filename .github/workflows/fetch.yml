name: Resultados ESPN

# Recolecta los marcadores del Mundial desde ESPN y los publica en este repo
# como espn.json. La app (en PythonAnywhere) lee ese archivo desde GitHub,
# que SÍ está permitido por el plan gratis.

on:
  schedule:
    - cron: "*/5 * * * *"     # cada 5 minutos
  workflow_dispatch:           # botón para ejecutarlo a mano

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar marcadores de ESPN
        run: |
          python3 - <<'PY'
          import json, urllib.request
          RANGES = ["20260611-20260628", "20260628-20260720"]
          BASE = ("https://site.api.espn.com/apis/site/v2/sports/soccer/"
                  "fifa.world/scoreboard")
          seen, events = set(), []
          for rng in RANGES:
              url = f"{BASE}?dates={rng}&limit=300"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  data = json.load(urllib.request.urlopen(req, timeout=30))
              except Exception as e:
                  print("error en", rng, e)
                  continue
              for ev in data.get("events", []):
                  if ev.get("id") in seen:
                      continue
                  seen.add(ev.get("id"))
                  events.append(ev)
          with open("espn.json", "w", encoding="utf-8") as f:
              json.dump({"events": events}, f, ensure_ascii=False)
          print("eventos guardados:", len(events))
          PY

      - name: Publicar si cambió
        run: |
          git config user.name "espn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add espn.json
          git commit -m "Actualiza resultados ESPN" || echo "sin cambios"
          git push
